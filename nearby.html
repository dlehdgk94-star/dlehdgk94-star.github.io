    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Barlow',sans-serif; }
        html{ scroll-behavior:smooth; }
        a{ text-decoration:none; color:inherit; }
        body{ color:rgb(28,28,28); -webkit-font-smoothing:antialiased; }

        /* ── 상단 유틸리티 바 ── */
        .top-util-bar{ background-color:rgb(28,28,28); color:#fff; height:49px; padding:0 48px 0 25px; display:flex; justify-content:space-between; align-items:center; }
        .hamburger-menu{ cursor:pointer; display:flex; flex-direction:column; gap:3px; padding:5px; }
        .hamburger-menu span{ width:12px; height:1px; background-color:#fff; border-radius:2px; }
        .util-login-btn{ display:flex; align-items:center; gap:6px; background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.4); border-radius:25px; padding:5px 12px; font-size:11px; font-weight:500; cursor:pointer; }
        .util-login-btn i{ font-size:13px; }
        .util-login-btn:hover{ border-color:#fff; background-color:rgba(255,255,255,0.1); }
        .util-right-group{ display:flex; align-items:center; gap:24px; }

        /* ── 헤더 ── */
        .top-header{ display:flex; justify-content:space-between; align-items:center; height:88px; padding:0 48px 0 30px; background-color:rgb(244,244,244); border-bottom:1px solid #e6e6e6; }
        .logo{ display:flex; align-items:center; }
        .logo img{ width:auto; height:58px; }
        .header-left{ display:flex; align-items:flex-end; gap:12px; }
        .header-rating{ display:flex; align-items:center; gap:10px; align-self:flex-end; }
        .header-right{ display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:8px; height:100%; }
        .main-nav{ display:flex; align-items:center; gap:32px; list-style:none; font-size:14px; font-weight:500; color:rgb(112,112,112); height:auto; }
        .main-nav li{ cursor:pointer; display:flex; align-items:center; position:relative; height:auto; padding:2px 0; }
        .main-nav li.active{ color:rgb(28,28,28); font-weight:700; }
        .main-nav li.active::after{ content:''; position:absolute; left:0; right:0; bottom:-5px; height:3px; background:#2A91A8; }
        .rating-dots{ color:#3A9AB4; font-size:16px; display:flex; align-items:center; gap:5px; }
        .rating-text{ font-size:14px; font-weight:500; color:rgb(28,28,28); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
        .hotel-info-right{ display:flex; gap:24px; font-size:14px; font-weight:500; color:rgb(28,28,28); }
        .hotel-info-right a{ display:flex; align-items:center; gap:5px; }

        /* ── 예약바 ── */
        .sticky-wrapper{ position:-webkit-sticky; position:sticky; top:0; z-index:1000; background:#FAFAFA; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        .sticky-wrapper{ display:none; }

        .booking-bar{ display:flex; justify-content:space-between; align-items:center; height:112px; padding:0 30px; background:#fff; border-bottom:1px solid #e5e5e5; position:relative; }
        .booking-item{ display:flex; flex-direction:column; justify-content:center; gap:18px; height:100%; padding:0 178px; position:relative; }
        .booking-item:first-child{ padding-left:0; }
        .booking-item:nth-child(1){ flex:0 0 478px; padding-right:0; }
        .booking-item:nth-child(2){ flex:0 0 626px; }
        .booking-item:nth-child(3){ flex:1 1 auto; padding-right:118px; }
        .booking-item:nth-child(-n+2)::after{ content:''; position:absolute; right:0; top:50%; transform:translateY(-50%); height:65px; border-right:1px dashed #1C1C1C; }
        .booking-item:last-child{ flex:0 0 116px; align-items:flex-start; padding:0 20px 0 0; }
        .booking-label{ font-size:12px; font-weight:700; color:rgb(112,112,112); display:flex; align-items:center; gap:7px; }
        .booking-label i{ font-size:16px; color:rgb(28,28,28); }
        .booking-value{ font-size:16px; font-weight:500; color:rgb(28,28,28); display:flex; align-items:center; cursor:pointer; gap:10px; }
        #date-booking-item .booking-value{ gap:30px; }
        #guest-booking-item .booking-value,
        #price-booking-item .booking-value{ width:270px; justify-content:space-between; }
        .booking-value .fa-chevron-down{ font-size:14px; }
        .date-arrow{ font-size:13px; }
        .search-btn{ background-color:rgb(114,107,113); color:#fff; border:none; width:95px; height:40px; border-radius:22px; font-size:16px; font-weight:700; cursor:pointer; }
        .search-btn:hover{ background-color:rgb(95,89,94); }
        .price-popup{ width:320px; padding:20px 24px; left:0; right:auto; }
        .price-popup-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #f0f0f0; cursor:pointer; }
        .price-popup-row:last-child{ border-bottom:none; }
        .price-popup-row:hover .price-popup-name{ color:#2A91A8; }
        .price-popup-name{ font-size:14px; font-weight:600; color:rgb(28,28,28); }
        .price-popup-total{ font-size:13px; font-weight:600; color:rgb(28,28,28); white-space:nowrap; }
        .price-popup-unavail{ cursor:default; opacity:0.45; }
        .price-popup-unavail:hover .price-popup-name{ color:rgb(28,28,28); }

        /* ── 드롭다운 ── */
        .booking-dropdown{ position:absolute; top:calc(100% + 20px); left:0; background:#fff; border-radius:15px; box-shadow:0 15px 40px rgba(0,0,0,0.15); padding:30px; z-index:2000; display:none; }
        .booking-dropdown.active{ display:block; }
        .dropdown-close{ position:absolute; top:20px; right:20px; font-size:16px; cursor:pointer; color:rgb(112,112,112); }
        .calendar-dropdown{ width:750px; left:-20px; }
        .cal-months-wrap{ display:flex; gap:40px; margin-top:10px; }
        .cal-month{ flex:1; }
        .cal-month-header{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:15px; margin-bottom:20px; }
        .cal-month-header i{ cursor:pointer; font-size:16px; padding:5px; }
        .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; gap:10px 0; }
        .cal-day-name{ font-size:12px; font-weight:700; color:rgb(112,112,112); margin-bottom:10px; }
        .cal-date{ font-size:13px; font-weight:500; color:rgb(112,112,112); padding:10px 0; cursor:pointer; border-radius:20px; }
        .cal-date.faded{ color:#ccc; cursor:default; }
        .cal-date.selected-start{ background:#000; color:#fff; border-radius:20px 0 0 20px; }
        .cal-date.selected-end{ background:#000; color:#fff; border-radius:0 20px 20px 0; }
        .cal-date.in-range{ background:#FAFAFA; border-radius:0; }
        .guest-dropdown{ width:420px; left:-20px; }
        .guest-notice{ font-size:11px; color:rgb(112,112,112); margin-bottom:20px; }
        .guest-row{ display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid #f0f0f0; }
        .guest-label-box{ display:flex; flex-direction:column; gap:5px; }
        .g-title{ font-weight:700; font-size:15px; }
        .g-sub{ font-size:11px; color:rgb(112,112,112); }
        .guest-controls{ display:flex; align-items:center; gap:15px; }
        .btn-ctrl{ width:32px; height:32px; border-radius:50%; border:1px solid #ddd; background:#fff; display:flex; justify-content:center; align-items:center; cursor:pointer; }
        .val-ctrl{ font-size:15px; font-weight:600; width:15px; text-align:center; }
        .dropdown-done-btn{ display:block; width:100px; margin:30px auto 0; padding:10px 0; border-radius:20px; border:1px solid #777; background:#fff; font-weight:600; font-size:13px; cursor:pointer; text-align:center; }

        /* ── 히어로 ── */
        .nearby-hero{ width:100%; height:calc(100vh - 313px); min-height:400px; background:#c8c8c8; position:relative; overflow:hidden; }
        .nearby-hero img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
        .nearby-hero-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.38); display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; }
        .nearby-hero-label-row{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
        .nearby-hero-line{ flex:0 0 60px; height:1px; background:rgba(255,255,255,0.6); }
        .nearby-hero-label{ font-size:13px; letter-spacing:3px; font-weight:400; opacity:0.9; white-space:nowrap; }
        .nearby-hero-title{ font-size:38px; font-weight:700; letter-spacing:0; line-height:1.3; }
        .nearby-hero-scroll{ position:absolute; bottom:32px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; color:#fff; font-size:12px; letter-spacing:2px; opacity:0.7; }
        .nearby-hero-scroll i{ font-size:18px; animation:bounce 1.6s infinite; }
        @keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

        /* ── 주변 섹션 ── */
        .nearby-section{ background:#fff; padding:52px 0 80px; }
        .nearby-inner{ max-width:1240px; margin:0 auto; padding:0 40px; }
        .nearby-section-header{ margin-bottom:32px; }
        .nearby-section-title{ font-size:22px; font-weight:700; color:rgb(28,28,28); margin-bottom:6px; }
        .nearby-section-sub{ font-size:14px; color:rgb(112,112,112); }

        /* ── 카테고리 탭 ── */
        .nb-tabs-wrap{ border-bottom:2px solid #e8e8e8; margin-bottom:40px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
        .nb-tabs-wrap::-webkit-scrollbar{ display:none; }
        .nb-tabs{ display:flex; white-space:nowrap; }
        .nb-tab-btn{ background:none; border:none; border-bottom:3px solid transparent; padding:13px 20px 10px; font-size:14px; font-weight:600; color:rgb(112,112,112); cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:color 0.2s, border-color 0.2s; flex-shrink:0; font-family:'Barlow',sans-serif; margin-bottom:-2px; }
        .nb-tab-btn i{ font-size:13px; }
        .nb-tab-btn.active{ color:rgb(28,28,28); border-bottom-color:rgb(28,28,28); }
        .nb-tab-btn:hover:not(.active){ color:rgb(112,112,112); }

        /* ── 카드 그리드 ── */
        .nb-card-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
        .nb-card{ background:#fff; border:1px solid #e8e8e8; border-radius:6px; overflow:hidden; transition:box-shadow 0.2s, transform 0.2s; }
        .nb-card:hover{ box-shadow:0 4px 16px rgba(0,0,0,0.1); transform:translateY(-3px); }
        .nb-card-photo{ aspect-ratio:3/2; background:#e8e8e8; overflow:hidden; }
        .nb-card-photo img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.4s; }
        .nb-card:hover .nb-card-photo img{ transform:scale(1.04); }
        .nb-card-photo-placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:28px; }
        .nb-card-body{ padding:16px 18px; }
        .nb-card-header-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
        .nb-card-name{ font-size:15px; font-weight:700; color:rgb(28,28,28); }
        .nb-card-distance{ font-size:11px; font-weight:600; color:rgb(112,112,112); background:#f5f5f5; border-radius:12px; padding:3px 9px; white-space:nowrap; flex-shrink:0; }
        .nb-card-desc{ font-size:13px; color:rgb(112,112,112); line-height:1.65; margin-bottom:12px; }
        .nb-card-link{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:#2A91A8; text-decoration:none; }
        .nb-card-link:hover{ text-decoration:underline; text-underline-offset:2px; }
        .nb-card-link i{ font-size:10px; }
        .nb-empty-msg{ grid-column:1/-1; text-align:center; padding:60px 0; font-size:15px; color:rgb(112,112,112); }
        @media (max-width:900px){ .nb-card-grid{ grid-template-columns:repeat(2,1fr); } }
        @media (max-width:540px){ .nb-card-grid{ grid-template-columns:1fr; } }
            /* ── 언어 선택 ── */
        .lang-selector{ position:relative; }
        .lang-btn{ display:flex; align-items:center; gap:6px; background:none; border:1px solid #d0d0d0; border-radius:20px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; color:rgb(112,112,112); font-family:'Barlow',sans-serif; transition:border-color 0.2s,color 0.2s; }
        .lang-btn:hover{ border-color:#aaa; color:rgb(28,28,28); }
        .lang-btn .fa-globe{ font-size:13px; }
        .lang-chevron{ font-size:9px; }
        .lang-dropdown{ position:absolute; top:calc(100% + 10px); right:0; background:#fff; border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,0.13); padding:6px 0; min-width:110px; display:none; z-index:1500; }
        .lang-dropdown.open{ display:block; }
        .lang-option{ display:block; padding:10px 18px; font-size:13px; font-weight:500; color:rgb(112,112,112); cursor:pointer; white-space:nowrap; }
        .lang-option:hover{ background:#f5f5f5; color:rgb(28,28,28); }
        .lang-option.active{ color:rgb(28,28,28); font-weight:700; }
    </style>

<body onclick="closeDropdowns(event)">

    <!-- 상단 유틸리티 바 -->
    <div class="top-util-bar">
        <div class="hamburger-menu"><span></span><span></span><span></span></div>
        <div class="util-right-group">
            <button class="util-login-btn" data-i18n="nav.util_benefit">공식 홈페이지 예약 시 최대 혜택</button>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="top-header">
        <div class="header-left">
            <a href="index.html" class="logo"><img src="instalogo.png" alt="INSTA Hotel 로고" width="600" height="190"></a>
            <div class="header-rating">
                <span class="rating-dots">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star-half-stroke"></i>
                </span>
                <span class="rating-text" onclick="openReviewModal()" style="cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">4.9<span style="font-size:28px; line-height:1; position:relative; top:-2px;">·</span><span style="text-decoration:underline; text-underline-offset:3px;" data-i18n="header.reviews">1446개의 리뷰</span></span>
            </div>
        </div>
        <div class="header-right">
            <ul class="main-nav">
                <li><a href="index.html" data-i18n="nav.hotel">호텔소개</a></li>
                <li><a href="rooms.html" data-i18n="nav.rooms">객실예약</a></li>
                <li><a href="gallery.html" data-i18n="nav.gallery">갤러리</a></li>
                <li class="active"><a href="nearby.html" data-i18n="nav.nearby">주변안내</a></li>
                <li class="lang-selector" onclick="event.stopPropagation()">
                    <button class="lang-btn" onclick="toggleLangDropdown(event)"><i class="fa-solid fa-globe"></i><span id="langCode">KO</span><i class="fa-solid fa-chevron-down lang-chevron"></i></button>
                    <div class="lang-dropdown" id="langDropdown">
                        <span class="lang-option active" data-code="KO" onclick="selectLang(this)">한국어</span>
                        <span class="lang-option" data-code="EN" onclick="selectLang(this)">English</span>
                        <span class="lang-option" data-code="JA" onclick="selectLang(this)">日本語</span>
                        <span class="lang-option" data-code="ZH" onclick="selectLang(this)">中文</span>
                    </div>
                </li>
            </ul>
            <div class="hotel-info-right">
                <a href="https://www.instagram.com/instar_hotel_/" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" onclick="openLocationModal(event)"><i class="fa-solid fa-location-dot"></i></a>
                <a href="#"><i class="fa-solid fa-phone"></i> +82 31-203-4301</a>
            </div>
        </div>
    </header>

    <!-- 예약바 -->
    <div class="sticky-wrapper">
        <div class="booking-bar">
            <div class="booking-item" id="date-booking-item">
                <span class="booking-label" id="nights-label"><i class="fa-regular fa-calendar"></i> 날짜 (1 박)</span>
                <div class="booking-value" onclick="toggleCalendarPopup(event)">
                    <span id="checkin-date-text">날짜 선택</span>
                    <i class="fa-solid fa-arrow-right date-arrow"></i>
                    <span id="checkout-date-text"></span>
                </div>
                <div class="booking-dropdown calendar-dropdown" id="calendarPopup" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-xmark dropdown-close" onclick="closeDropdowns(event)"></i>
                    <div class="cal-months-wrap">
                        <div class="cal-month">
                            <div class="cal-month-header"><i class="fa-solid fa-chevron-left" onclick="changeMonth(-1)"></i><span id="cal-month-title-left"></span><span></span></div>
                            <div class="cal-grid" id="cal-grid-left"></div>
                        </div>
                        <div class="cal-month">
                            <div class="cal-month-header"><span></span><span id="cal-month-title-right"></span><i class="fa-solid fa-chevron-right" onclick="changeMonth(1)"></i></div>
                            <div class="cal-grid" id="cal-grid-right"></div>
                        </div>
                    </div>
                    <button class="dropdown-done-btn" onclick="calendarDone(event)" data-i18n="booking.calendar_done">완료</button>
                </div>
            </div>
            <div class="booking-item" id="guest-booking-item">
                <span class="booking-label" data-i18n="booking.guest_label">객실 & 투숙객</span>
                <div class="booking-value" onclick="toggleGuestPopup(event)">
                    <span id="guest-summary-text">1 객실, 1 성인</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="booking-dropdown guest-dropdown" id="guestPopup" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-xmark dropdown-close" onclick="closeDropdowns(event)"></i>
                    <div class="guest-row">
                        <div class="guest-label-box"><span class="g-title" data-i18n="booking.room">객실</span></div>
                        <div class="guest-controls">
                            <button class="btn-ctrl" onclick="updateGuest('room',-1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-ctrl" id="val-room">1</span>
                            <button class="btn-ctrl" onclick="updateGuest('room',1)"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                    <div class="guest-row">
                        <div class="guest-label-box"><span class="g-title" data-i18n="booking.adult">성인</span></div>
                        <div class="guest-controls">
                            <button class="btn-ctrl" onclick="updateGuest('adult',-1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-ctrl" id="val-adult">1</span>
                            <button class="btn-ctrl" onclick="updateGuest('adult',1)"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                    <button class="dropdown-done-btn" onclick="guestDone(event)" data-i18n="booking.guest_done">완료</button>
                </div>
            </div>
            <div class="booking-item" id="price-booking-item">
                <span class="booking-label" data-i18n="booking.price_label">객실선택 & 특별요금</span>
                <div class="booking-value" onclick="togglePricePopup(event)"><span id="min-price-text">최저 요금</span><i class="fa-solid fa-chevron-down"></i></div>
                <div class="booking-dropdown price-popup" id="pricePopup" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-xmark dropdown-close" onclick="event.stopPropagation(); document.getElementById('pricePopup').classList.remove('active')"></i>
                    <div id="pricePopupList"></div>
                </div>
            </div>
            <div class="booking-item">
                <button class="search-btn" onclick="handleBookingBtn()" data-i18n="booking.btn">예약하기</button>
            </div>
        </div>
    </div>

    <!-- 히어로 -->
    <section class="nearby-hero">
        <img src="images/nearby/main.png?v=1" alt="주변안내" width="2184" height="720">
        <div class="nearby-hero-overlay">
            <div class="nearby-hero-label-row">
                <span class="nearby-hero-line"></span>
                <span class="nearby-hero-label" data-i18n="nearby.hero.label">호텔 인스타</span>
                <span class="nearby-hero-line"></span>
            </div>
            <h1 class="nearby-hero-title" data-i18n="nearby.hero.title">관광 · 삼성 비즈니스 · 교통 · 생활편의시설</h1>
        </div>
        <div class="nearby-hero-scroll">
            <span>SCROLL</span>
            <i class="fa-solid fa-chevron-down"></i>
        </div>
    </section>

    <!-- 주변 관광지 섹션 -->
    <section class="nearby-section">
        <div class="nearby-inner">
            <div class="nearby-section-header">
                <h2 class="nearby-section-title" data-i18n="nearby.section.title">관광부터 비즈니스까지, 호텔 주변의 다양한 정보를 한눈에</h2>
                <p class="nearby-section-sub" data-i18n="nearby.section.sub">호텔 근처의 다양한 명소와 편의시설을 확인하세요</p>
            </div>

            <!-- 카테고리 탭 -->
            <div class="nb-tabs-wrap">
                <div class="nb-tabs" id="nbTabs"></div>
            </div>

            <!-- 카드 그리드 -->
            <div class="nb-card-grid" id="nbCardGrid"></div>
        </div>
    </section>

    <script>
        /* ── 예약 바 ── */
        const _today=new Date(); _today.setHours(0,0,0,0);
        const _tomorrow=new Date(_today); _tomorrow.setDate(_today.getDate()+1);
        let checkinDate=_today, checkoutDate=_tomorrow;
        let calViewYear=_today.getFullYear(), calViewMonth=_today.getMonth();
        const DAY_NAMES=['일','월','화','수','목','금','토'];
        const MONTHS_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

        function fmtDate(d) {
            if (!d) return '';
            var lang = typeof currentLang !== 'undefined' ? currentLang : 'ko';
            var days = typeof calDayNames === 'function' ? calDayNames() : DAY_NAMES;
            var m = d.getMonth() + 1, date = d.getDate(), day = days[d.getDay()];
            if (lang === 'en') {
                var sm = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return sm[d.getMonth()] + ' ' + date + ', ' + day;
            }
            if (lang === 'ja' || lang === 'zh') return m + '月' + date + '日(' + day + ')';
            return m + '월 ' + date + '일, ' + day;
        }
        function updateDateUI() {
            var nights = Math.round((checkoutDate - checkinDate) / 86400000);
            var nightsLabel = typeof fmtDateNights === 'function' ? fmtDateNights(nights) : '날짜 (' + nights + '박)';
            document.getElementById('nights-label').innerHTML = '<i class="fa-regular fa-calendar"></i> ' + nightsLabel;
            document.getElementById('checkin-date-text').textContent = checkinDate ? fmtDate(checkinDate) : (typeof t === 'function' ? t('booking.date_select') : '날짜 선택');
            document.getElementById('checkout-date-text').textContent = checkoutDate ? fmtDate(checkoutDate) : '';
        }
        function renderCalendar() {
            var _days = typeof calDayNames === 'function' ? calDayNames() : DAY_NAMES;
            ['left','right'].forEach(function(side, idx) {
                var m = (calViewMonth + idx) % 12, yr = calViewYear + (calViewMonth + idx >= 12 ? 1 : 0);
                var monthTitle = typeof fmtCalMonth === 'function' ? fmtCalMonth(yr, m) : (yr + '년 ' + MONTHS_KO[m]);
                document.getElementById('cal-month-title-' + side).textContent = monthTitle;
                var grid = document.getElementById('cal-grid-' + side);
                grid.innerHTML = '';
                _days.forEach(function(n) { var s = document.createElement('span'); s.className = 'cal-day-name'; s.textContent = n; grid.appendChild(s); });
                var first = new Date(yr, m, 1).getDay();
                for (var i = 0; i < first; i++) { grid.appendChild(document.createElement('span')); }
                var days = new Date(yr, m + 1, 0).getDate();
                for (var d = 1; d <= days; d++) {
                    var date = new Date(yr, m, d);
                    var s = document.createElement('span');
                    s.className = 'cal-date'; s.textContent = d;
                    if (date < _today) { s.classList.add('faded'); }
                    else {
                        if (checkinDate && date.getTime() === checkinDate.getTime()) s.classList.add('selected-start');
                        if (checkoutDate && date.getTime() === checkoutDate.getTime()) s.classList.add('selected-end');
                        if (checkinDate && checkoutDate && date > checkinDate && date < checkoutDate) s.classList.add('in-range');
                        s.onclick = function() { selectDate(date); };
                    }
                    grid.appendChild(s);
                }
            });
        }
        let pickingCheckin=true;
        let datesUserSelected=false;
        let _autoAdvDate=true;
        let _datesExplicitlySet=false;
        function selectDate(d){ if(pickingCheckin||d<=checkinDate){ checkinDate=d; checkoutDate=null; pickingCheckin=false; datesUserSelected=false; var el=document.getElementById('min-price-text'); if(el) el.textContent=typeof t==='function'?t('booking.min_price'):'최저 요금'; document.getElementById('pricePopup').classList.remove('active'); } else{ checkoutDate=d; pickingCheckin=true; datesUserSelected=true; _datesExplicitlySet=true; updateDateUI(); if(_autoAdvDate){ setTimeout(function(){ document.getElementById('calendarPopup').classList.remove('active'); document.getElementById('guestPopup').classList.add('active'); },350); } } renderCalendar(); }
        function changeMonth(dir){ calViewMonth+=dir; if(calViewMonth<0){calViewMonth=11;calViewYear--;} if(calViewMonth>11){calViewMonth=0;calViewYear++;} renderCalendar(); }
        function toggleCalendarPopup(e){ e.stopPropagation(); var opening=!document.getElementById('calendarPopup').classList.contains('active'); if(opening&&checkinDate&&checkoutDate&&_datesExplicitlySet) _autoAdvDate=false; else if(opening) _autoAdvDate=true; document.getElementById('guestPopup').classList.remove('active'); document.getElementById('calendarPopup').classList.toggle('active'); }
        function toggleGuestPopup(e){ e.stopPropagation(); document.getElementById('calendarPopup').classList.remove('active'); document.getElementById('guestPopup').classList.toggle('active'); }
        function togglePricePopup(e){ e.stopPropagation(); populatePricePopup(); document.getElementById('pricePopup').classList.toggle('active'); }
        function closeDropdowns(e){ document.getElementById('calendarPopup').classList.remove('active'); document.getElementById('guestPopup').classList.remove('active'); if(!datesUserSelected) document.getElementById('pricePopup').classList.remove('active'); }
        function calendarDone(e){ if(e) e.stopPropagation(); document.getElementById('calendarPopup').classList.remove('active'); document.getElementById('pricePopup').classList.remove('active'); if(checkinDate&&checkoutDate){ setTimeout(function(){ document.getElementById('guestPopup').classList.add('active'); },150); } }
        function guestDone(e){ closeDropdowns(e); setTimeout(function(){ populatePricePopup(); document.getElementById('pricePopup').classList.add('active'); },200); }

        let guests={room:1,adult:1,child:0};
        function updateGuest(type,dir){ guests[type]=Math.max(0,guests[type]+dir); if(guests.room<1) guests.room=1; if(guests.adult<1) guests.adult=1; document.getElementById('val-room').textContent=guests.room; document.getElementById('val-adult').textContent=guests.adult; document.getElementById('guest-summary-text').textContent=typeof fmtGuestCount==='function'?fmtGuestCount(guests.room,guests.adult):guests.room+' 객실, '+guests.adult+' 성인'; updateRoomPrices(); }

        function openBookingCalendar() {
            setTimeout(function() {
                document.getElementById('guestPopup').classList.remove('active');
                document.getElementById('calendarPopup').classList.add('active');
            }, 0);
        }
        function handleBookingBtn(){
            if(!checkinDate||!checkoutDate){ openBookingCalendar(); return; }
            if(!selectedRoomId){ alert(typeof t==='function'?t('booking.select_room_alert'):'객실을 선택해 주세요.'); document.getElementById('pricePopup').classList.add('active'); populatePricePopup(); return; }
            var nights=Math.round((checkoutDate-checkinDate)/86400000);
            var roomCount=guests?guests.room:1, adultCount=guests?guests.adult:1;
            var total=0; for(var i=0;i<nights;i++){ var d=new Date(checkinDate); d.setDate(d.getDate()+i); total+=getNightRateN(selectedRoomId,d); } total*=roomCount;
            var roomName=ROOM_NAMES_N[selectedRoomId]||selectedRoomId;
            function toLocalDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
            localStorage.setItem('instaHotelBooking',JSON.stringify({ roomId:selectedRoomId,roomName:roomName,checkin:toLocalDateStr(checkinDate),checkout:toLocalDateStr(checkoutDate),nights:nights,roomCount:roomCount,adultCount:adultCount,totalPrice:total }));
            window.location.href='booking.html';
        }
        var selectedRoomId=null;
        const ROOM_PRICE_TABLE_N={
            edelweiss:{prices:[49500,58500,72000],maxGuests:2},
            aurora:   {prices:[58000,67000,81000],maxGuests:2},
            glorio:   {prices:[67000,76000,99000],maxGuests:2},
            envidion: {prices:[76000,85000,108000],maxGuests:3},
            special:  {prices:[99000,108000,126000],maxGuests:4},
            ruby:     {prices:[76000,85000,108000],maxGuests:2}
        };
        const ROOM_NAMES_N={edelweiss:'이코노미 룸',aurora:'스탠다드 룸 (디자인 랜덤배정)',glorio:'디럭스 룸 (디자인 랜덤배정)',envidion:'트윈 룸',special:'스페셜 룸',ruby:'루비 룸'};
        const ROOM_ORDER_N=['edelweiss','aurora','glorio','envidion','special','ruby'];
        function fmtWon(n){ return n.toLocaleString('ko-KR'); }
        function getNightRateN(id,date){ var r=ROOM_PRICE_TABLE_N[id]; if(!r) return 0; var d=date.getDay(); return d===6?r.prices[2]:d===5?r.prices[1]:r.prices[0]; }
        function populatePricePopup(){
            if(!checkinDate||!checkoutDate) return;
            var listEl=document.getElementById('pricePopupList'); if(!listEl) return;
            var nights=Math.round((checkoutDate-checkinDate)/86400000);
            var roomCount=guests?guests.room:1, adultCount=guests?guests.adult:1;
            listEl.innerHTML=ROOM_ORDER_N.map(function(id){
                var pt=ROOM_PRICE_TABLE_N[id];
                var title=typeof getRoomName==='function'?getRoomName(id):(ROOM_NAMES_N[id]||id);
                var available=pt&&adultCount<=pt.maxGuests*roomCount;
                var total=0; for(var i=0;i<nights;i++){ var nd=new Date(checkinDate); nd.setDate(nd.getDate()+i); total+=getNightRateN(id,nd); } total*=roomCount;
                var nightTotal=typeof fmtNightTotal==='function'?fmtNightTotal(nights,total):(nights+'박 총 '+fmtWon(total)+'원');
                var unavailText=typeof fmtUnavailMax==='function'?fmtUnavailMax(pt.maxGuests*roomCount):('최대 '+(pt.maxGuests*roomCount)+'인');
                if(!available) return '<div class="price-popup-row price-popup-unavail"><span class="price-popup-name">'+title+'</span><span class="price-popup-total" style="color:rgb(180,180,180);">'+unavailText+'</span></div>';
                return '<div class="price-popup-row" onclick="selectRoom(\''+id+'\')"><span class="price-popup-name">'+title+'</span><span class="price-popup-total">'+nightTotal+'</span></div>';
            }).join('');
        }
        function updateRoomPrices(){
            var el=document.getElementById('min-price-text'); if(!el) return;
            if(checkinDate&&checkoutDate){
                populatePricePopup();
                if(selectedRoomId){
                    var nights=Math.round((checkoutDate-checkinDate)/86400000);
                    var roomCount=guests?guests.room:1; var total=0;
                    for(var i=0;i<nights;i++){ var nd=new Date(checkinDate); nd.setDate(nd.getDate()+i); total+=getNightRateN(selectedRoomId,nd); } total*=roomCount;
                    var roomName=typeof getRoomName==='function'?getRoomName(selectedRoomId):(ROOM_NAMES_N[selectedRoomId]||'');
                    var nightTotal=typeof fmtNightTotal==='function'?fmtNightTotal(nights,total):(nights+'박 총 '+fmtWon(total)+'원');
                    el.textContent=(roomName?roomName+' · ':'')+nightTotal;
                } else { el.textContent=typeof t==='function'?t('booking.min_price'):'최저 요금'; }
            } else { el.textContent=typeof t==='function'?t('booking.min_price'):'최저 요금'; document.getElementById('pricePopup').classList.remove('active'); }
        }
        function selectRoom(roomId){
            selectedRoomId=roomId;
            if(checkinDate&&checkoutDate){
                var nights=Math.round((checkoutDate-checkinDate)/86400000);
                var roomCount=guests?guests.room:1; var total=0;
                for(var i=0;i<nights;i++){ var nd=new Date(checkinDate); nd.setDate(nd.getDate()+i); total+=getNightRateN(roomId,nd); } total*=roomCount;
                var roomName=typeof getRoomName==='function'?getRoomName(roomId):(ROOM_NAMES_N[roomId]||'');
                var nightTotal=typeof fmtNightTotal==='function'?fmtNightTotal(nights,total):(nights+'박 총 '+fmtWon(total)+'원');
                document.getElementById('min-price-text').textContent=(roomName?roomName+' · ':'')+nightTotal;
            }
            document.getElementById('pricePopup').classList.remove('active');
            var _sb=document.querySelector('.search-btn'); if(_sb){ _sb.classList.add('auto-highlight'); setTimeout(function(){ _sb.classList.remove('auto-highlight'); },3000); }
        }

        /* ── 주변 카드 그리드 ── */
        var _activeNbCat = '';

        function switchNbTab(id) {
            _activeNbCat = id;
            document.querySelectorAll('.nb-tab-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.id === id);
            });
            renderNbCards(id);
        }

        function renderNbCards(catId) {
            var cat = (typeof nearbyData !== 'undefined') && nearbyData.categories.find(function(c) { return c.id === catId; });
            var grid = document.getElementById('nbCardGrid');
            grid.innerHTML = '';
            if (!cat || !cat.places || cat.places.length === 0) {
                var msg = document.createElement('div');
                msg.className = 'nb-empty-msg';
                msg.textContent = '준비 중입니다';
                grid.appendChild(msg);
                return;
            }
            cat.places.forEach(function(place) {
                var card = document.createElement('div');
                card.className = 'nb-card';
                if (place.url) {
                    card.style.cursor = 'pointer';
                    card.onclick = (function(u) { return function() { window.open(u, '_blank', 'noopener,noreferrer'); }; })(place.url);
                }

                var photoDiv = document.createElement('div');
                photoDiv.className = 'nb-card-photo';
                if (place.photo) {
                    var img = document.createElement('img');
                    img.src = place.photo;
                    img.alt = place.name;
                    img.loading = 'lazy';
                    photoDiv.appendChild(img);
                } else {
                    var ph = document.createElement('div');
                    ph.className = 'nb-card-photo-placeholder';
                    ph.innerHTML = '<i class="fa-regular fa-image"></i>';
                    photoDiv.appendChild(ph);
                }

                var body = document.createElement('div');
                body.className = 'nb-card-body';

                var headerRow = document.createElement('div');
                headerRow.className = 'nb-card-header-row';
                var nameEl = document.createElement('span');
                nameEl.className = 'nb-card-name';
                nameEl.textContent = place.name;
                var distEl = document.createElement('span');
                distEl.className = 'nb-card-distance';
                distEl.innerHTML = '<i class="fa-solid fa-location-dot"></i> ' + place.distance;
                headerRow.appendChild(nameEl);
                headerRow.appendChild(distEl);

                var descEl = document.createElement('p');
                descEl.className = 'nb-card-desc';
                descEl.textContent = place.description;

                body.appendChild(headerRow);
                body.appendChild(descEl);

                card.appendChild(photoDiv);
                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            renderCalendar();
            updateDateUI();

            if (typeof nearbyData !== 'undefined') {
                var tabsEl = document.getElementById('nbTabs');
                nearbyData.categories.forEach(function(cat, idx) {
                    var btn = document.createElement('button');
                    btn.className = 'nb-tab-btn' + (idx === 0 ? ' active' : '');
                    btn.dataset.id = cat.id;
                    btn.textContent = cat.label;
                    btn.onclick = function() { switchNbTab(cat.id); };
                    tabsEl.appendChild(btn);
                });
                _activeNbCat = nearbyData.categories[0].id;
                renderNbCards(_activeNbCat);
            }
        });
    </script>
    <script>
        function toggleLangDropdown(e){ e.stopPropagation(); document.getElementById('langDropdown').classList.toggle('open'); }
        function selectLang(el){ var lang=el.dataset.code.toLowerCase(); if(typeof setLanguage==='function'){ setLanguage(lang); } document.getElementById('langDropdown').classList.remove('open'); }
        document.addEventListener('click', function(){ var d=document.getElementById('langDropdown'); if(d)d.classList.remove('open'); });
    </script>
